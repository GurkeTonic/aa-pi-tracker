{% if planet_type == "temperate" %}<i class="fas fa-leaf me-1"></i>
{% elif planet_type == "barren" %}<i class="fas fa-circle me-1"></i>
{% elif planet_type == "oceanic" %}<i class="fas fa-water me-1"></i>
{% elif planet_type == "ice" %}<i class="fas fa-snowflake me-1"></i>
{% elif planet_type == "gas" %}<i class="fas fa-cloud me-1"></i>
{% elif planet_type == "lava" %}<i class="fas fa-fire me-1"></i>
{% elif planet_type == "storm" %}<i class="fas fa-bolt me-1"></i>
{% elif planet_type == "plasma" %}<i class="fas fa-sun me-1"></i>
{% else %}<i class="fas fa-globe me-1"></i>{% endif %}
